backend:
  name: github
  repo: lmpharmafounder-max/LMPHARMA1
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://lmpharma.netlify.app

locale: ar

collections:

  # =========================
  # ⚙️ إعدادات الموقع
  # =========================

  - name: settings
    label: ⚙️ إعدادات الموقع
    files:

      - label: معلومات المتجر
        name: store
        file: "content/settings/store.yml"

        fields:

          - label: اسم المتجر
            name: site_name
            widget: string
            default: "LM Pharma"

          - label: الشعار Logo
            name: logo
            widget: image
            required: false

          - label: وصف المتجر
            name: description
            widget: text
            required: false

          - label: رقم الهاتف
            name: phone
            widget: string
            required: false

          - label: WhatsApp
            name: whatsapp
            widget: string
            required: false

          - label: البريد الإلكتروني
            name: email
            widget: string
            required: false

          - label: Facebook
            name: facebook
            widget: string
            required: false

          - label: Instagram
            name: instagram
            widget: string
            required: false

          - label: العنوان
            name: address
            widget: string
            required: false

          - label: التوصيل
            name: delivery
            widget: string
            default: "التوصيل لجميع أنحاء المغرب"

          - label: الدفع
            name: payment
            widget: string
            default: "الدفع عند الاستلام"


  # =========================
  # 🎞️ Slider
  # =========================

  - name: slider
    label: 🎞️ Slider / Banner
    folder: "content/slider"
    create: true
    slug: "{{slug}}"
    format: yaml

    fields:

      - label: صورة السلايدر
        name: image
        widget: image

      - label: العنوان
        name: title
        widget: string
        required: false

      - label: النص
        name: description
        widget: text
        required: false

      - label: نص الزر
        name: button_text
        widget: string
        required: false

      - label: رابط الزر
        name: button_link
        widget: string
        required: false

      - label: ترتيب السلايدر
        name: order
        widget: number
        default: 1

      - label: إظهار السلايدر
        name: active
        widget: boolean
        default: true


  # =========================
  # 🗂️ التصنيفات
  # =========================

  - name: categories
    label: 🗂️ التصنيفات
    folder: "content/categories"
    create: true
    slug: "{{slug}}"
    format: yaml

    fields:

      - label: اسم التصنيف
        name: name
        widget: string

      - label: صورة التصنيف
        name: image
        widget: image
        required: false

      - label: وصف التصنيف
        name: description
        widget: text
        required: false

      - label: ترتيب التصنيف
        name: order
        widget: number
        default: 1

      - label: إظهار التصنيف
        name: active
        widget: boolean
        default: true


  # =========================
  # 🛍️ المنتجات
  # =========================

  - name: products
    label: 🛍️ المنتجات
    folder: "products"
    create: true
    slug: "{{slug}}"
    format: frontmatter

    fields:

      # ---------- المعلومات الأساسية ----------

      - label: اسم المنتج
        name: title
        widget: string

      - label: السعر الأساسي
        name: price
        widget: number

      - label: السعر القديم
        name: old_price
        widget: number
        required: false


      # ---------- عروض الكمية ----------

      - label: 🎁 عروض الكمية
        name: quantity_offers
        widget: list
        required: false
        summary: "{{fields.quantity}} علب — {{fields.price}} DH"

        fields:

          - label: عدد العلب
            name: quantity
            widget: number
            value_type: int
            min: 1
            default: 1

          - label: اسم العرض
            name: label
            widget: string
            required: false
            hint: "مثال: عرض علبتين"

          - label: الثمن
            name: price
            widget: number
            value_type: float

          - label: الثمن القديم
            name: old_price
            widget: number
            value_type: float
            required: false

          - label: العرض مفعل
            name: active
            widget: boolean
            default: true


      # ---------- Upsell ----------

      - label: 🔥 منتجات مقترحة Upsell
        name: upsell_products
        widget: relation
        collection: products
        search_fields:
          - title
        value_field: "{{slug}}"
        display_fields:
          - title
        multiple: true
        required: false


      # ---------- الصور ----------

      - label: صورة المنتج
        name: image
        widget: image

      - label: صور إضافية
        name: gallery
        widget: list
        required: false

        field:
          label: صورة
          name: image
          widget: image


      # ---------- التصنيف ----------

      - label: التصنيف
        name: category
        widget: relation
        collection: categories
        search_fields:
          - name
        value_field: "{{slug}}"
        display_fields:
          - name


      # ---------- الوصف ----------

      - label: وصف قصير
        name: short_description
        widget: text
        required: false

      - label: وصف المنتج
        name: description
        widget: markdown

      - label: معلومات المنتج
        name: details
        widget: markdown
        required: false

      - label: طريقة الاستعمال
        name: usage
        widget: text
        required: false


      # ---------- الحالة ----------

      - label: المنتج متوفر
        name: available
        widget: boolean
        default: true

      - label: منتج مميز
        name: featured
        widget: boolean
        default: false


  # =========================
  # 📦 Packs & Bundles
  # =========================

  - name: packs
    label: 📦 Packs & Bundles
    folder: "content/packs"
    create: true
    slug: "{{slug}}"
    format: yaml

    fields:

      - label: اسم الـPack
        name: name
        widget: string

      - label: صورة الـPack
        name: image
        widget: image
        required: false

      - label: وصف الـPack
        name: description
        widget: text
        required: false


      # ---------- المنتجات داخل Pack ----------

      - label: 🛍️ المنتجات داخل الـPack
        name: items
        widget: list
        summary: "{{fields.quantity}} × {{fields.product}}"

        fields:

          - label: المنتج
            name: product
            widget: relation
            collection: products
            search_fields:
              - title
            value_field: "{{slug}}"
            display_fields:
              - title

          - label: الكمية
            name: quantity
            widget: number
            value_type: int
            min: 1
            default: 1


      # ---------- السعر ----------

      - label: ثمن الـPack
        name: price
        widget: number
        value_type: float

      - label: الثمن القديم
        name: old_price
        widget: number
        value_type: float
        required: false


      # ---------- الحالة ----------

      - label: Pack مفعل
        name: active
        widget: boolean
        default: true

      - label: Pack مميز
        name: featured
        widget: boolean
        default: false


  # =========================
  # 📄 الصفحات
  # =========================

  - name: pages
    label: 📄 الصفحات
    folder: "pages"
    create: true
    slug: "{{slug}}"
    format: frontmatter

    fields:

      - label: عنوان الصفحة
        name: title
        widget: string

      - label: صورة الغلاف
        name: image
        widget: image
        required: false

      - label: محتوى الصفحة
        name: body
        widget: markdown

      - label: إظهار الصفحة
        name: active
        widget: boolean
        default: true


  # =========================
  # 🏠 الصفحة الرئيسية
  # =========================

  - name: homepage
    label: 🏠 الصفحة الرئيسية

    files:

      - label: محتوى الرئيسية
        name: home
        file: "content/home.yml"

        fields:

          - label: العنوان الرئيسي
            name: hero_title
            widget: string

          - label: النص الرئيسي
            name: hero_description
            widget: text
            required: false

          - label: صورة Hero
            name: hero_image
            widget: image
            required: false

          - label: نص زر Hero
            name: hero_button
            widget: string
            required: false

          - label: رابط زر Hero
            name: hero_link
            widget: string
            required: false

          - label: عنوان قسم المنتجات
            name: products_title
            widget: string
            default: "منتجاتنا"

          - label: عنوان قسم التصنيفات
            name: categories_title
            widget: string
            default: "تسوق حسب التصنيف"

          - label: عنوان قسم المميزات
            name: features_title
            widget: string
            default: "لماذا تختار LM Pharma؟"


  # =========================
  # ❓ FAQ
  # =========================

  - name: faq
    label: ❓ الأسئلة الشائعة
    folder: "content/faq"
    create: true
    slug: "{{slug}}"
    format: yaml

    fields:

      - label: السؤال
        name: question
        widget: string

      - label: الجواب
        name: answer
        widget: text

      - label: الترتيب
        name: order
        widget: number
        default: 1
