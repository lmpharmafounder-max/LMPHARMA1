backend:
  name: github
  repo: lmpharmafounder-max/LMPHARMA1
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://lmpharma.netlify.app

collections:

  - name: products
    label: المنتجات
    folder: "products"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    
    fields:
      - label: اسم المنتج
        name: title
        widget: string

      - label: السعر
        name: price
        widget: number

      - label: السعر القديم
        name: old_price
        widget: number
        required: false

      - label: صورة المنتج
        name: image
        widget: image

      - label: الوصف
        name: description
        widget: text

      - label: حالة المنتج
        name: available
        widget: boolean
        default: true

      - label: معلومات المنتج
        name: details
        widget: text
        required: false

  - name: pages
    label: الصفحات
    files:

      - label: الصفحة الرئيسية
        name: home
        file: "content/home.yml"
        fields:
          - label: عنوان الموقع
            name: title
            widget: string

          - label: الوصف
            name: description
            widget: text

      - label: معلومات التواصل
        name: contact
        file: "content/contact.yml"
        fields:
          - label: الهاتف
            name: phone
            widget: string

          - label: واتساب
            name: whatsapp
            widget: string

          - label: العنوان
            name: address
            widget: string
